# Publishes the site to the gh-pages branch (GitHub Pages serves it from there):
#   https://<owner>.github.io/<repo>/         -> F1 game (index.html)
#   https://<owner>.github.io/<repo>/racer/   -> Tiny Lambo Racer
name: Publish to gh-pages

on:
  push:
    branches: [f4]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir -p _site/racer
          cp index.html _site/
          cp -r racer/index.html racer/src racer/vendor _site/racer/
          touch _site/.nojekyll
      - name: Cache-bust the game's modules
        # Browsers cache ES modules by URL; stamping every relative import with the commit
        # means a new deploy is always fetched fresh, never mixed with stale cached files.
        run: |
          V=${GITHUB_SHA::7}
          find _site/racer/src -name '*.js' -exec sed -i -E \
            -e "s#(from |import\()'(\.{1,2}/[^'?]+\.js)'#\1'\2?v=$V'#g" {} +
          sed -i -E "s#src=\"\./src/main\.js\"#src=\"./src/main.js?v=$V\"#" _site/racer/index.html
      - name: Push to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
