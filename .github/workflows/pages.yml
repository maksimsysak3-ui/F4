# Publishes the site to the gh-pages branch (GitHub Pages serves it from there):
#   https://<owner>.github.io/<repo>/         -> F1 game (index.html)
#   https://<owner>.github.io/<repo>/racer/   -> Tiny Lambo Racer
name: Publish to gh-pages

on:
  push:
    branches: [f4]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir -p _site/racer
          cp index.html _site/
          cp -r racer/index.html racer/src racer/vendor _site/racer/
          touch _site/.nojekyll
      - name: Push to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
